services:
  api:
    build: .
    image: ai-multi-search:latest
    container_name: ai-multi-search-api
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
    depends_on:
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
    ports:
      - "127.0.0.1:18100:8000"
    restart: unless-stopped
    networks: [internal, caddy]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: ai-multi-search-redis
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Private meta-search (JSON API). Not published to host; only api → searxng.
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: ai-multi-search-searxng
    restart: unless-stopped
    networks: [internal]
    volumes:
      - ./deploy/searxng:/etc/searxng:rw
      - searxng-data:/var/cache/searxng
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-changeme-searxng-secret-key}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  searxng-data:

networks:
  internal:
  caddy:
    external: true
    name: ${CADDY_DOCKER_NETWORK:-caddy_proxy}
